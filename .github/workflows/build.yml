name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/genshin-notes-widget-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshin-notes-widget-release-apk
          path: artifacts/genshin-notes-widget-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update Latest Release (on main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (Auto-Release)
          body: |
            Automated latest release built from commit ${{ github.sha }}.
            
            Download the APK below and install with `adb install -r --user 0` or standard sideloading.
          files: artifacts/genshin-notes-widget-release.apk
          prerelease: true
          make_latest: true

      - name: Create Versioned Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/genshin-notes-widget-release.apk
          generate_release_notes: true
