name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
      - '*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/genshin-notes-widget-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshin-notes-widget-release-apk
          path: artifacts/genshin-notes-widget-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Versioned Release (only on explicit tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/genshin-notes-widget-release.apk
          generate_release_notes: true
